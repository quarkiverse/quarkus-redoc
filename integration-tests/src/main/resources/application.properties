# X-Logo configuration for testing
quarkus.redoc.extensions.x-logo.url=/redoc-logo.png
quarkus.redoc.extensions.x-logo.background-color=#FFFFFF
quarkus.redoc.extensions.x-logo.alt-text=Test Logo
quarkus.redoc.extensions.x-logo.href=https://example.com

# X-TagGroups configuration for testing
quarkus.redoc.extensions.x-tag-groups[0].name=User Management
quarkus.redoc.extensions.x-tag-groups[0].tags=users,authentication
quarkus.redoc.extensions.x-tag-groups[1].name=Content
quarkus.redoc.extensions.x-tag-groups[1].tags=posts,comments
# x-tag-groups-ungrouped-name defaults to "Other"
